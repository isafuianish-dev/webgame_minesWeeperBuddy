<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper Buddy</title>
<link rel="icon" type="image/png" href="media/favicon.png">
<link rel="stylesheet" href="https://isafuianish-dev.github.io/webapp_cdnBuddy/css/tokens.css">
<link rel="stylesheet" href="https://isafuianish-dev.github.io/webapp_cdnBuddy/css/base.css">
<link rel="stylesheet" href="style.css">
<script src="https://isafuianish-dev.github.io/webapp_cdnBuddy/js/theme-init.js" data-app="webgame_minesWeeperBuddy"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-icon" aria-hidden="true"><span class="icon" style="-webkit-mask-image:url(media/icon.svg);mask-image:url(media/icon.svg);"></span></span>
      <h1>Minesweeper Buddy</h1>
    </div>
    <div class="topbar-actions">
      <button id="btnShare" class="btn btn-ghost btn-icon" title="Share Progress" aria-label="Share Progress"></button>
      <button id="btnHighScores" class="btn btn-ghost btn-icon" title="High Scores" aria-label="High Scores"></button>
      <button id="btnHelp" class="btn btn-ghost btn-icon" title="Help" aria-label="Help"></button>
      <button id="btnSettings" class="btn btn-ghost btn-icon" title="Settings" aria-label="Settings"></button>
    </div>
  </header>

  <div class="mw-toolbar">
    <div class="mw-toolbar-left">
      <div class="status-toggle" id="difficultyToggle">
        <button type="button" class="status-toggle-option" data-difficulty="easy">Easy</button>
        <button type="button" class="status-toggle-option" data-difficulty="medium">Medium</button>
        <button type="button" class="status-toggle-option" data-difficulty="hard">Hard</button>
        <button type="button" class="status-toggle-option" data-difficulty="expert">Expert</button>
      </div>
    </div>

    <div class="mw-scoreboard" role="status" aria-label="Game status">
      <div class="mw-stat mw-stat-mines" title="Mines remaining">
        <span class="mw-stat-icon-cell"><span id="minesIcon"></span></span>
        <span class="mw-stat-value-cell" id="minesLeft">10</span>
      </div>
      <div class="mw-stat mw-stat-timer" title="Time elapsed">
        <span class="mw-stat-icon-cell"><span id="timerIcon"></span></span>
        <span class="mw-stat-value-cell" id="timeElapsed">00:00</span>
      </div>
      <div class="mw-stat mw-stat-best" title="Best time for this setup">
        <span class="mw-stat-icon-cell"><span id="bestIcon"></span></span>
        <span class="mw-stat-value-cell" id="bestTime">--:--</span>
      </div>
    </div>
  </div>

  <main class="mw-board-wrap">
    <div class="mw-board-scroll" id="boardScroll">
      <div class="mw-board" id="board" role="grid" aria-label="Minesweeper board"></div>
    </div>
    <p class="mw-hint">Left click to reveal &middot; Right click to flag &middot; Double-click a number to clear its flagged neighbors</p>
  </main>

  <div class="mw-banner" id="banner" hidden></div>
</div>

<script src="https://isafuianish-dev.github.io/webapp_cdnBuddy/js/utils.js"></script>
<script src="https://isafuianish-dev.github.io/webapp_cdnBuddy/js/icons.js"></script>
<script src="https://isafuianish-dev.github.io/webapp_cdnBuddy/js/modal.js"></script>
<script src="https://isafuianish-dev.github.io/webapp_cdnBuddy/js/theme.js"></script>
<script src="https://isafuianish-dev.github.io/webapp_cdnBuddy/js/confetti.js"></script>
<script src="https://isafuianish-dev.github.io/webapp_cdnBuddy/js/settings.js"></script>
<script src="https://isafuianish-dev.github.io/webapp_cdnBuddy/js/markdown.js"></script>
<script src="https://isafuianish-dev.github.io/webapp_cdnBuddy/js/manual.js"></script>
<script src="script.js"></script>
</body>
</html>
